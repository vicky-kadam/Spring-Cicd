
  name: Spring Boot CI

  on:
    push:
      branches:
        - main

  jobs:
    build:
      name: Build and Test Spring Boot
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Give Maven Wrapper Permission
          run: chmod +x mvnw

        - name: Build and Test
          run: ./mvnw clean verify

